name: .NET with Docker

on:
  push:
    branches: [ "Dev" ]
  pull_request:
    branches: [ "Dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build the API image from your Dockerfile
    - name: Build API Docker image
      run: docker build -t projectindependence-api -f API/ProjectIndependence/ProjectIndependence.API/Dockerfile .

    # Run tests inside SDK container
    - name: Run tests in container
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/src \
          -w /src/API/ProjectIndependence \
          mcr.microsoft.com/dotnet/sdk:8.0 \
          dotnet test ProjectIndependence.sln --no-build --verbosity normal
